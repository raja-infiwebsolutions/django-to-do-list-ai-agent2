<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" id="deleteForm">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title text-danger" id="deleteModalLabel">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong id="deleteItemName">this item</strong>? This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Wire delete modal so it receives data from the triggering button
document.addEventListener('DOMContentLoaded', function () {
  var deleteModalEl = document.getElementById('deleteModal');
  if (!deleteModalEl) return;

  deleteModalEl.addEventListener('show.bs.modal', function (event) {
    var button = event.relatedTarget; // Button that triggered the modal
    if (!button) return;
    var title = button.getAttribute('data-title') || 'this item';
    var url = button.getAttribute('data-url') || '#';
    var form = deleteModalEl.querySelector('#deleteForm');
    var nameEl = deleteModalEl.querySelector('#deleteItemName');
    if (form) form.action = url;
    if (nameEl) nameEl.textContent = title;
  });
});
</script>
