{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center" href="{% url 'todos:list' %}">
      <span class="fw-bold"><i class="bi bi-check2-square me-2"></i>TodoApp</span>
    </a>

    <!-- Hamburger toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation items -->
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        {% if user.is_authenticated %}
          <!-- Authenticated user menu -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'todos:list' %}" title="View all todos">
              <i class="bi bi-list-task me-1"></i> Todos
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm ms-lg-2 mb-2 mb-lg-0" href="{% url 'todos:create' %}" title="Create a new todo">
              <i class="bi bi-plus-lg me-1"></i> New Todo
            </a>
          </li>

          <!-- User dropdown menu -->
          <li class="nav-item dropdown ms-3">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false" title="User menu">
              <i class="bi bi-person-circle fs-5"></i>
              <span class="d-lg-none ms-2">{{ user.first_name|default:user.username }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
              <li>
                <h6 class="dropdown-header">
                  {{ user.first_name }} {{ user.last_name }}
                </h6>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{% url 'todos:stats' %}"><i class="bi bi-graph-up me-2"></i>Statistics</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="{% url 'auth:logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </li>
        {% else %}
          <!-- Unauthenticated user menu -->
          <li class="nav-item me-2">
            <a class="btn btn-outline-primary btn-sm" href="{% url 'auth:login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm" href="{% url 'auth:signup' %}">
              <i class="bi bi-person-plus me-1"></i> Sign Up
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
