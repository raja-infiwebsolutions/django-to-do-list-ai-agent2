{% extends 'base.html' %}
{% load static %}
{% block title %}Create Todo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0"><i class="bi bi-plus-lg me-2"></i>Create Todo</h2>
          <a href="{% url 'todos:list' %}" class="btn btn-outline-secondary btn-sm">Back to list</a>
        </div>

        {% if form.non_field_errors %}
          <div class="alert alert-danger" role="alert">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        {% include 'todos/_form.html' %}
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// inline small script to focus the first input for better UX
document.addEventListener('DOMContentLoaded', function(){
  var el = document.getElementById('id_title');
  if(el) el.focus();
});
</script>
{% endblock %}
