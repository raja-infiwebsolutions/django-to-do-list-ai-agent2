<form method="post" novalidate id="todoForm">
  {% csrf_token %}

  <div class="mb-3">
    <label for="id_title" class="form-label">Title</label>
    <input type="text" name="title" class="form-control {% if form.title.errors %}is-invalid{% endif %}" id="id_title" placeholder="e.g. Buy groceries" value="{% if form.title.value %}{{ form.title.value }}{% elif todo %}{{ todo.title }}{% else %}{% endif %}" required>
    {% if form.title.errors %}
      <div class="invalid-feedback">{{ form.title.errors|striptags }}</div>
    {% else %}
      <div class="form-text">Give your todo a short, descriptive title.</div>
    {% endif %}
  </div>

  <div class="mb-3">
    <label for="id_description" class="form-label">Description</label>
    <textarea name="description" class="form-control {% if form.description.errors %}is-invalid{% endif %}" id="id_description" rows="4" placeholder="Details about this todo">{% if form.description.value %}{{ form.description.value }}{% elif todo %}{{ todo.description }}{% else %}{% endif %}</textarea>
    {% if form.description.errors %}
      <div class="invalid-feedback">{{ form.description.errors|striptags }}</div>
    {% endif %}
  </div>

  <div class="mb-4 form-check">
    <input type="checkbox" name="completed" class="form-check-input" id="id_completed" {% if form.completed.value %}checked{% elif todo and todo.completed %}checked{% endif %}>
    <label class="form-check-label" for="id_completed">Mark as completed</label>
  </div>

  <div class="d-flex justify-content-between align-items-center">
    <a href="{% url 'todos:list' %}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary" id="submitBtn">
      <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="submitSpinner"></span>
      <span id="submitText">{% if todo %}Update{% else %}Create{% endif %}</span>
    </button>
  </div>
</form>
