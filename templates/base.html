{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Todo App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa6mY5Y3v1+qf2QYf5eFQ5e1bYQe1Z6V9ZZ5+Y5n3zV9zZ6Q5n3zV9zZ6Q5" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Project CSS -->
    <link href="{% static 'css/calculator.css' %}" rel="stylesheet">
    <link href="{% static 'css/todos.css' %}" rel="stylesheet">

    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-light">

    {% include 'partials/navbar.html' %}

    <main class="py-4">
      <div class="container">
        {% include 'partials/alerts.html' %}
        {% block content %}{% endblock %}
      </div>
    </main>

    {% include 'partials/footer.html' %}

    <!-- Bootstrap bundle with Popper (for modal/collapse) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HI6S9F2b5e1Z6V9ZZ5+Y5n3zV9zZ6Q5n3zV9zZ6Q5" crossorigin="anonymous"></script>
    <!-- Project JS -->
    <script src="{% static 'js/todos.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
